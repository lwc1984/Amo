<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent 控制台</title>
<style>
:root{
  --bg:#0E1420; --surface:#18202E; --raised:#1F2937;
  --line:#26324a; --text:#C8D3E4; --dim:#68789A;
  --run:#3FBFD8; --wait:#FFB020; --idle:#4A5B78; --stale:#E2564A;
  --mono: ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--mono);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── 注意力条：整页的签名元素 ───────────────────── */
#attention{
  position:sticky; top:0; z-index:20; height:6px; background:var(--line);
  transition:background .2s;
}
body.alert #attention{ background:var(--wait); animation:bar 1.1s ease-in-out infinite }
@keyframes bar{ 0%,100%{opacity:1; box-shadow:0 0 22px 2px var(--wait)} 50%{opacity:.35; box-shadow:none} }

header{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding:14px 20px 12px; border-bottom:1px solid var(--line);
}
h1{font-size:15px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
#conn{font-size:13px; letter-spacing:.1em; color:var(--dim)}
#conn.on::before{content:"●"; color:var(--run); margin-right:6px}
#conn.off::before{content:"●"; color:var(--stale); margin-right:6px}
button{
  margin-left:auto; font-family:inherit; font-size:14px; letter-spacing:.08em;
  background:transparent; color:var(--dim); border:1px solid var(--line);
  padding:6px 14px; border-radius:2px; cursor:pointer;
}
button:hover,button:focus-visible{color:var(--text); border-color:var(--dim)}
button.armed{color:var(--run); border-color:var(--run)}

/* ── 指标行 ─────────────────────────────────── */
#metrics{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  border-bottom:1px solid var(--line);
}
.metric{padding:14px 20px; border-right:1px solid var(--line); position:relative; overflow:hidden}
.metric .k{font-size:14px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
.metric .v{font-size:34px; font-weight:300; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.metric .v small{font-size:15px; color:var(--dim); margin-left:2px}
.metric svg{position:absolute; inset:auto 0 0 0; width:100%; height:26px; opacity:.5}

/* ── Session 列表 ───────────────────────────── */
#head{padding:22px 20px 10px; font-size:13px; letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
#list{display:flex; flex-direction:column; gap:9px; padding:0 20px 28px}
.s{
  display:flex; gap:14px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--idle); border-radius:3px; padding:14px 16px;
}
.s .body{min-width:0; flex:1}
.s .top{display:flex; align-items:baseline; gap:12px}
.s .name{font-size:21px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.s .tag{margin-left:auto; font-size:14px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.s .detail{font-size:15px; color:var(--dim); margin-top:5px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.s .path{font-size:13px; color:#4A5670; margin-top:4px}

.s.running{border-left-color:var(--run)}   .s.running .tag{color:var(--run)}
.s.idle   {border-left-color:var(--idle)}  .s.idle .tag{color:var(--dim)}
.s.stale  {border-left-color:var(--stale)} .s.stale .tag{color:var(--stale)}
.s.waiting{
  border-left-color:var(--wait); border-color:#4a3a15; background:#231d10;
  animation:card 1.1s ease-in-out infinite;
}
.s.waiting .tag{color:var(--wait); font-weight:700}
.s.waiting .name{color:#fff}
@keyframes card{ 50%{background:#2E2412; border-color:var(--wait)} }

#empty{padding:0 20px; color:var(--dim); font-size:15px}

/* ── 配对二维码浮层 ─────────────────────────── */
#qrmask{
  position:fixed; inset:0; z-index:20; background:rgba(6,10,18,.88);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#qrmask[hidden]{display:none}          /* display:flex 会盖掉 hidden，得显式关掉 */
#qrbox{
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:24px; max-width:min(92vw,420px); text-align:center;
}
#qrbox h2{font-size:16px; font-weight:600; letter-spacing:.1em; margin-bottom:18px}
#qrimg{background:#fff; padding:12px; border-radius:3px; display:inline-block; line-height:0}
#qrimg svg{display:block; width:min(68vw,264px); height:auto}
#qrhint{margin-top:16px; font-size:13px; color:var(--dim); line-height:1.6}
#qrurl{margin-top:10px; font-size:12px; color:#4A5670; word-break:break-all;
  user-select:all; line-height:1.7}

@media (prefers-reduced-motion:reduce){ *{animation:none !important} }
@media (max-width:520px){ .metric .v{font-size:28px} }
</style>
</head>
<body>
<div id="attention"></div>

<header>
  <h1>Agent 控制台</h1>
  <span id="conn" class="off">连接中</span>
  <button id="qr" hidden>配对平板</button>
  <button id="arm">叫醒我</button>
</header>

<div id="qrmask" hidden>
  <div id="qrbox">
    <h2>用平板扫这个</h2>
    <div id="qrimg"></div>
    <div id="qrhint">扫不动就照着下面这行手敲。地址里带着令牌，别截图发群里。</div>
    <div id="qrurl"></div>
  </div>
</div>

<div id="metrics"></div>

<div id="head">会话 · <span id="count">0</span></div>
<div id="list"></div>
<div id="empty" hidden>一个会话都没有。随便找个项目敲 claude 就出来了。</div>

<script>
/* ── 令牌：URL 带一次，之后存起来 ── */
const KEY_NAME = 'agentdash_token';
const urlKey = new URLSearchParams(location.search).get('k');
if (urlKey) {
  localStorage.setItem(KEY_NAME, urlKey);
  history.replaceState(null, '', location.pathname);   // 别把令牌留在地址栏
}
const TOKEN = localStorage.getItem(KEY_NAME);

const $ = s => document.querySelector(s);
const TITLE = 'Agent 控制台';
let armed = false, audio = null, wakeLock = null, alerting = false, blinker = null;

/* ── 配对二维码：只有在宿主机本机打开时才有这个入口 ──
   /api/qr 只对回环开放。平板上打开这个页面拿到的是 403，按钮就一直藏着。
   二维码里编的是带令牌的地址，画给整个局域网看等于把令牌公开，
   60 秒配对窗口也就白设了。 */
fetch('/api/qr')
  .then(r => r.ok ? r.json() : null)
  .then(d => {
    if (!d) return;                      // 403：不是本机，入口不出现
    $('#qrimg').innerHTML = d.svg;
    $('#qrurl').textContent = d.url;
    $('#qr').hidden = false;
  })
  .catch(() => {});                      // 服务没起来时静默，页面其余部分照常

$('#qr').onclick = () => $('#qrmask').hidden = false;
$('#qrmask').onclick = () => $('#qrmask').hidden = true;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#qrmask').hidden = true;
});

/* ── 提醒：声音 + 震动 + 标题闪烁 + 系统通知 ── */
$('#arm').onclick = async () => {
  audio = new (window.AudioContext || window.webkitAudioContext)();
  await audio.resume();
  if ('Notification' in window) { try { await Notification.requestPermission(); } catch {} }
  armed = true;
  $('#arm').classList.add('armed');
  $('#arm').textContent = '盯着呢';
  requestWakeLock();
  beep(880, .08);
};

function beep(freq = 660, dur = .18) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.25, audio.currentTime + .01);
  g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + dur);
  o.connect(g).connect(audio.destination);
  o.start(); o.stop(audio.currentTime + dur + .02);
}

function startAlert(names) {
  if (alerting) return;
  alerting = true;

  // 视觉：不需要用户手势，任何时候都该生效 —— 这条横线是整个设计的核心
  document.body.classList.add('alert');
  blinker = setInterval(() => {
    document.title = document.title.startsWith('⚠') ? TITLE : '⚠ 该你了';
  }, 900);

  // 以下三样浏览器都要求先有用户手势，只能等点过"叫醒我"
  if (!armed) return;
  beep(740, .16); setTimeout(() => beep(988, .22), 200);
  navigator.vibrate?.([180, 90, 180, 90, 300]);
  if (window.Notification?.permission === 'granted') {
    new Notification(LABEL.waiting, { body: names.join('、'), tag: 'agent-wait', renotify: true });
  }
}

function stopAlert() {
  if (!alerting) return;
  alerting = false;
  document.body.classList.remove('alert');
  clearInterval(blinker);
  document.title = TITLE;
}

/* ── 阻止熄屏 ── */
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;   // 非 HTTPS 时不存在，靠系统设置兜底
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

/* ── 渲染 ── */
function spark(vals, color) {
  if (!vals?.length) return '';
  const max = Math.max(...vals, 1);
  const pts = vals.map((v, i) =>
    `${(i / Math.max(vals.length - 1, 1) * 100).toFixed(1)},${(26 - v / max * 24).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 100 26" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.2"
      vector-effect="non-scaling-stroke"/></svg>`;
}

const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB/s'
           : n > 1024 ? (n / 1024).toFixed(0) + ' KB/s' : n + ' B/s';

function renderMetrics(m) {
  const cards = [
    ['CPU', m.cpu?.toFixed(0), '%', m.hist.cpu, 'var(--run)'],
    ['内存', m.mem?.toFixed(0), '%', m.hist.mem, 'var(--run)'],
    ['磁盘', m.disk?.toFixed(0), '%', null, ''],
    ['GPU', m.gpu ?? '—', m.gpu == null ? '' : '%', m.hist.gpu, 'var(--wait)'],
    ['显存', m.vram ?? '—', m.vram == null ? '' : '%', null, ''],
    ['网络', kb(m.net_down + m.net_up), '', m.hist.net, 'var(--idle)'],
  ];
  $('#metrics').innerHTML = cards.map(([k, v, u, h, c]) => `
    <div class="metric"><div class="k">${k}</div>
      <div class="v">${v}<small>${u}</small></div>${h ? spark(h, c) : ''}</div>`).join('');
}

const LABEL = {
  running: '干着呢，别催',
  waiting: '哥们儿，该你了',
  idle:    '摸鱼中，等你发话',
  stale:   '没声儿了，人呢？',
};

function renderSessions(list) {
  $('#count').textContent = list.length;
  $('#empty').hidden = list.length > 0;
  $('#list').innerHTML = list.map(s => `
    <div class="s ${s.state}">
      <div class="body">
        <div class="top">
          <span class="name">${esc(s.name)}</span>
          <span class="tag">${LABEL[s.state] || s.state}</span>
        </div>
        <div class="detail">${esc(s.detail || '—')}</div>
        <div class="path">${esc(s.host || '')} · ${esc(s.cwd || '')}</div>
      </div>
    </div>`).join('');

  const waiting = list.filter(s => s.state === 'waiting');
  if (waiting.length) startAlert(waiting.map(s => s.name));
  else stopAlert();
}

const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

/* ── SSE ── */
function showUnpaired(msg) {
  stopAlert();
  $('#conn').className = 'off';
  $('#conn').textContent = '未配对';
  $('#list').innerHTML = '';
  $('#count').textContent = '0';
  $('#empty').hidden = false;
  $('#empty').textContent = msg;
}

function connect() {
  if (!TOKEN) {
    showUnpaired('还没配对。在宿主机托盘里点『配对新设备』，然后从那儿复制地址过来。');
    return;
  }
  const es = new EventSource('/api/stream?k=' + encodeURIComponent(TOKEN));
  es.onopen = () => { $('#conn').className = 'on'; $('#conn').textContent = '连上了'; };
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    renderMetrics(d.metrics);
    renderSessions(d.sessions);
  };
  es.onerror = () => {
    es.close();
    $('#conn').className = 'off';
    $('#conn').textContent = '断了，正重连';
    // EventSource 看不到状态码，401 和"服务器挂了"长得一样。探一下才知道该不该重连。
    fetch('/api/tiny?k=' + encodeURIComponent(TOKEN))
      .then(r => {
        if (r.status === 401) {
          localStorage.removeItem(KEY_NAME);   // 废令牌留着只会下次继续 401
          showUnpaired('令牌失效了。去宿主机托盘重新点『配对新设备』，再把地址复制过来。');
          return;
        }
        setTimeout(connect, 3000);
      })
      .catch(() => setTimeout(connect, 3000));  // 网络问题，正常重连
  };
}
connect();
</script>
</body>
</html>
